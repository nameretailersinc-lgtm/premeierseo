
    steps:
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          : "${SSH_PRIVATE_KEY:?Missing DEPLOY_SSH_KEY secret}"
          : "${VPS_KNOWN_HOSTS:?Missing DEPLOY_KNOWN_HOSTS secret}"

          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy latest code to VPS
        env:
          VPS_HOST: ${{ secrets.DEPLOY_HOST }}
          VPS_USER: ${{ secrets.DEPLOY_USER }}
          VPS_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          : "${VPS_HOST:?Missing DEPLOY_HOST secret}"
          : "${VPS_USER:?Missing DEPLOY_USER secret}"

          ssh -p "${VPS_PORT:-22}" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" \
            "DEPLOY_SHA='$DEPLOY_SHA' bash -se" <<'EOF'
          set -euo pipefail
          cd /root/premeierseo

          git fetch origin main
          git checkout main
          git merge --ff-only "$DEPLOY_SHA"

          docker compose build web
          docker compose up -d --no-deps --force-recreate web
          docker compose ps web

          for attempt in $(seq 1 20); do
            if curl -fsS --max-time 5 http://127.0.0.1:3200/ > /dev/null; then
              echo "Deployment health check passed"
              exit 0
            fi
            sleep 3
          done

          echo "Deployment health check failed"
          docker compose logs --tail=100 web
          exit 1
          EOF
