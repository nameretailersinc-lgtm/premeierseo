services:
  web:
    build:
      context: .
      args:
        NEXT_PUBLIC_GA_ID: ${NEXT_PUBLIC_GA_ID:-}
        NEXT_PUBLIC_GSC_VERIFICATION: ${NEXT_PUBLIC_GSC_VERIFICATION:-}
        NEXT_PUBLIC_BING_VERIFICATION: ${NEXT_PUBLIC_BING_VERIFICATION:-}
    restart: unless-stopped
    ports:
      - "127.0.0.1:3200:3000"   # host 3000/3100 are used by other projects; nginx proxies here
    environment:
      IPINFO_TOKEN: ${IPINFO_TOKEN:-}
      PAGESPEED_API_KEY: ${PAGESPEED_API_KEY:-}
      REPORT_WEBHOOK_URL: ${REPORT_WEBHOOK_URL:-}
      # Blog admin at /admin/: set both in the server's .env (admin stays disabled while ADMIN_PASSWORD is empty).
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_SESSION_SECRET: ${ADMIN_SESSION_SECRET:-}
      # Blog posts and images (GridFS) are stored in MongoDB: Atlas or self-hosted.
      # e.g. mongodb+srv://user:pass@cluster0.xxxx.mongodb.net/premierseo?retryWrites=true&w=majority
      MONGODB_URI: ${MONGODB_URI:-}
      MONGODB_DB: ${MONGODB_DB:-}
